<!DOCTYPE html>
<html>
<body>
<script>
    // Lấy path, ví dụ: /au/sun-kissed-lavender
    const path = window.location.pathname;
    const parts = path.split('/');
    const slug = parts[parts.length - 1]; // Lấy 'sun-kissed-lavender'

    if (slug && slug !== 'index.html' && slug !== 'au') {
        // Lưu slug vào bộ nhớ tạm để index.html đọc
        sessionStorage.setItem('pendingPost', 'post-' + slug);
        // Chuyển về index.html
        window.location.href = '/au/index.html';
    } else {
        window.location.href = '/au/index.html';
    }
</script>
</body>
</html>
