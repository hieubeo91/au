<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
<script>
    const path = window.location.pathname;
    if (path.includes('/au/')) {
        const segments = path.split('/au/');
        const slug = segments[1] ? segments[1].replace(/\/$/, "") : null;
        if (slug) {
            const postId = "post-" + slug; 
            sessionStorage.setItem('openPostId', postId);
            window.location.href = '/au/index.html';
        } else {
            window.location.href = '/au/index.html';
        }
    } else {
        window.location.href = '/au/index.html';
    }
</script>
</head>
<body>
    <p>Đang tải bài viết...</p>
</body>
</html>
