  <script>
    function initAllSwipers() {
      document.querySelectorAll('.mySwiper').forEach((el) => {
        if (el.swiper) { el.swiper.destroy(true, true); }
        new Swiper(el, {
          loop: true,
          spaceBetween: 10,
          observer: true,
          observeParents: true,
          pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
          navigation: { nextEl: el.querySelector('.swiper-button-next'), prevEl: el.querySelector('.swiper-button-prev') },
          autoplay: { delay: 4500, disableOnInteraction: true },
        });
      });
    }
    initAllSwipers();

    Fancybox.bind("[data-fancybox^='gallery-']", { Thumbs: { autoStart: true } });

    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) { backToTopBtn.classList.add('show'); }
      else { backToTopBtn.classList.remove('show'); }
    });
    backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    const newsletterForm = document.getElementById('newsletter-form');
    const newsletterSuccess = document.getElementById('newsletter-success');
    if (newsletterForm) {
      newsletterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        newsletterForm.classList.add('hidden');
        newsletterSuccess.classList.remove('hidden');
      });
    }

    const CURRENT_POST = {
      title: "dgdf",
      tags: ["gdfgd"]
    };

    async function loadPosts() {
      try {
        const response = await fetch("../index.html");
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const cards = doc.querySelectorAll(".post-card");
        const posts = [];
        cards.forEach(card => {
          posts.push({
            title: card.dataset.title,
            url: card.dataset.url,
            image: card.dataset.image,
            tags: (card.dataset.tags || "").split(",").map(tag => tag.trim()).filter(Boolean)
          });
        });
        return posts;
      } catch (e) {
        console.error("Lỗi khi tải danh sách bài viết:", e);
        return [];
      }
    }

	function renderPosts(posts) {
      const container = document.getElementById("suggested-posts");
      if(!container) return;
      
      // 🎯 NÂNG CẤP 1: Giới hạn chỉ lấy tối đa đúng 5 bài viết
      const displayPosts = (posts || []).slice(0, 5);
      
      container.innerHTML = "";
      if(displayPosts.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">Không có bài viết gợi ý phù hợp.</div>';
        return;
      }
      
      // 🎯 NÂNG CẤP 2: Chạy vòng lặp trên displayPosts và dùng chuỗi nối (+) để loại bỏ 100% lỗi đơ nút
      displayPosts.forEach(post => {
        let correctUrl = post.url || '#';
        if (!correctUrl.startsWith('../') && !correctUrl.startsWith('./')) {
          correctUrl = '../' + correctUrl;
        }
        const imgUrl = post.image || 'https://raw.githubusercontent.com/hieubeo91/storage/main/blog/icon.png';

        container.innerHTML += '<a href="' + correctUrl + '" class="flex items-start gap-3 group p-2 rounded-xl hover:bg-slate-50 transition-all duration-200">';
        container.innerHTML += '  <img src="' + imgUrl + '" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 border border-slate-100 shadow-sm group-hover:scale-105 transition-transform">';
        container.innerHTML += '  <div class="space-y-1 flex-grow">';
        container.innerHTML += '    <h4 class="text-xs font-bold text-slate-800 group-hover:text-indigo-600 transition-colors line-clamp-2 leading-snug">' + post.title + '</h4>';
        container.innerHTML += '    <span class="text-[10px] text-slate-400 block mt-1">Xem bài viết →</span>';
        container.innerHTML += '  </div>';
        container.innerHTML += '</a>';
      });
    }

    function getRelatedPosts(posts) {
      if (!posts || !Array.isArray(posts)) return [];
      return [...posts]
        .filter(post => {
          if (!post || !CURRENT_POST) return false;
          // 1. Loại bỏ bài viết hiện tại khỏi danh sách hiển thị
          if (post.title === CURRENT_POST.title) return false;
          if (CURRENT_POST.dataUrl && post.url && post.url.includes(CURRENT_POST.dataUrl)) return false;
          
          // 2. Chuyển đổi dữ liệu Danh mục (categories) thành mảng để so sánh
          const postCats = (post.categories || '').split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
          const currentCats = (CURRENT_POST.categories || '').split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
          const hasCommonCategory = currentCats.some(cat => postCats.includes(cat));
          
          // 3. Chuyển đổi dữ liệu Từ khóa (tags) thành mảng để so sánh
          const postTagsStr = Array.isArray(post.tags) ? post.tags.join(',') : (post.tags || '');
          const postTags = postTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          
          const currentTagsStr = Array.isArray(CURRENT_POST.tags) ? CURRENT_POST.tags.join(',') : (CURRENT_POST.tags || '');
          const currentTags = currentTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          
          const hasCommonTag = currentTags.some(tag => postTags.includes(tag));
          
          return hasCommonCategory || hasCommonTag;
        })
        .slice(0, 3);
    }

    function getRandomPosts(posts) {
      if (!posts || !Array.isArray(posts)) return [];
      return [...posts]
        .filter(post => {
          if (!post) return false;
          if (post.title === CURRENT_POST.title) return false;
          if (CURRENT_POST.dataUrl && post.url && post.url.includes(CURRENT_POST.dataUrl)) return false;
          return true;
        })
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
    }

// Hàm dựng giao diện với bộ Dò Tìm Vùng Chứa thông minh (Tự động sửa lỗi thiếu excerpt)
// Hàm dựng giao diện chuẩn xác trỏ thẳng vào ID của Sidebar
	function renderPosts(postsList) {
	  // Sửa lại: Ưu tiên tìm đúng ID "detail-sidebar-list" ở cột bên phải trước
	  let container = document.getElementById("detail-sidebar-list") || 
					  document.querySelector('#sidebar-posts') || 
					  document.querySelector('.space-y-4.mt-4');
					  
	  if (!container) {
		const btn = document.getElementById("related-btn");
		if (btn && btn.parentElement && btn.parentElement.nextElementSibling) {
		  container = btn.parentElement.nextElementSibling;
		}
	  }

	  if (!container) {
		console.error("Không tìm thấy phân vùng Sidebar hiển thị bài viết trên trang!");
		return;

	document.addEventListener('DOMContentLoaded', function() {

		  return response.text();
		})
		.then(htmlText => {
		  // 2. Chuyển đổi chuỗi text thành DOM để dễ dàng bóc tách
		  const parser = new DOMParser();
		  const doc = parser.parseFromString(htmlText, 'text/html');
		  
		  // 3. Tìm khối slide theo ID đã đánh dấu ở bước 1
		  const indexSlide = doc.getElementById('shared-banner-slide');
		  
		  if (indexSlide) {
			// Chèn khối slide vào khung chờ trong bài viết con
			slideContainer.innerHTML = indexSlide.outerHTML;
			
			// 4. KHỞI CHẠY LOGIC ĐIỀU KHIỂN SLIDE (Giống hệt bên index)
			initInjectedSlide();
		  }
		})
		.catch(err => console.error('Lỗi tự động lấy Slide từ trang index:', err));

	  // Hàm khởi chạy hiệu ứng slide sau khi đã chèn thành công vào HTML
	  function initInjectedSlide() {
		// Để tránh trùng lặp biến với trang index, chúng ta tìm các element trực tiếp trong container mới chèn
		const container = slideContainer.querySelector('#banner-slides-container');
		const prevBtn = slideContainer.querySelector('#prev-slide-btn');
		const nextBtn = slideContainer.querySelector('#next-slide-btn');
		const dotsContainer = slideContainer.querySelector('#slide-dots-container');
		
		if (!container) return;
		
		const slides = container.children;
		const totalSlides = slides.length;
		let currentIndex = 0;
		let slideInterval;

		// Sinh các chấm tròn điều hướng
		dotsContainer.innerHTML = ''; // Xóa chấm cũ nếu có
		for (let i = 0; i < totalSlides; i++) {
		  const dot = document.createElement('div');
		  dot.className = 'w-1.5 h-1.5 rounded-full bg-white/40 transition-all cursor-pointer';
		  if (i === 0) dot.className += ' bg-white w-3';
		  dot.setAttribute('data-index', i);
		  dotsContainer.appendChild(dot);
		}
		
		const dots = dotsContainer.children;

		function goToSlide(index) {
		  if (index < 0) index = totalSlides - 1;
		  if (index >= totalSlides) index = 0;
		  currentIndex = index;
		  container.style.transform = `translateX(-${currentIndex * 100}%)`;
		  
		  for (let j = 0; j < dots.length; j++) {
			if (j === currentIndex) {
			  dots[j].className = 'w-1.5 h-1.5 rounded-full bg-white transition-all cursor-pointer w-3';
			} else {
			  dots[j].className = 'w-1.5 h-1.5 rounded-full bg-white/40 transition-all cursor-pointer';
			}
		  }
		}

		function startAutoSlide() {
		  stopAutoSlide();
		  slideInterval = setInterval(() => goToSlide(currentIndex + 1), 4000);
		}

		function stopAutoSlide() {
		  if (slideInterval) clearInterval(slideInterval);
		}

		if (nextBtn) nextBtn.addEventListener('click', () => { goToSlide(currentIndex + 1); startAutoSlide(); });
		if (prevBtn) prevBtn.addEventListener('click', () => { goToSlide(currentIndex - 1); startAutoSlide(); });

		dotsContainer.addEventListener('click', (e) => {
		  if (e.target.hasAttribute('data-index')) {
			const targetIdx = parseInt(e.target.getAttribute('data-index'));
			goToSlide(targetIdx);
			startAutoSlide();
		  }
		});

		container.parentElement.addEventListener('mouseenter', stopAutoSlide);
		container.parentElement.addEventListener('mouseleave', startAutoSlide);

		startAutoSlide();
	  }
	});

          // Hiển thị ngay các nút tính năng phân quyền Admin
          document.querySelectorAll('.admin-action-btn').forEach(function(btn) {
            btn.classList.remove('hidden');
          });
          // Thực hiện render lại danh sách hiện tại để cập nhật giao diện Admin hoàn chỉnh
          if (cachedSnapshotData) renderComments(cachedSnapshotData);
        }
      });
    }

    // 3. Lắng nghe thay đổi bộ lọc Sắp xếp
    if (sortSelect) {
      sortSelect.addEventListener('change', function() {
        if (cachedSnapshotData) {
          renderComments(cachedSnapshotData);
        }
      });
    }

    // 4. Hàm xử lý logic chính: Đọc dữ liệu, Phân loại Ghim, Sắp xếp và Dựng HTML
    function renderComments(dataObj) {
      if (!commentsWrapper) return;
      commentsWrapper.innerHTML = '';
      
      var commentKeys = Object.keys(dataObj);
      var allComments = commentKeys.map(function(key) {
        var item = dataObj[key];
        item._fbKey = key;
        return item;
      });

      if (commentCountSpan) commentCountSpan.textContent = allComments.length;

      if (allComments.length === 0) {
        commentsWrapper.innerHTML = '<p class="text-xs text-slate-400 italic text-center py-4">Chưa có bình luận nào. Hãy là người đầu tiên chia sẻ cảm nghĩ!</p>';
        return;
      }

      // Lấy tùy chọn sắp xếp hiện tại (Mặc định là 'newest' - mới nhất)
      var currentSortOrder = sortSelect ? sortSelect.value : 'newest';

      // Tách biệt bình luận gốc (cha) và bình luận phản hồi (con)
      var rootComments = allComments.filter(function(c) { return !c.replyTo; });
      var replyComments = allComments.filter(function(c) { return c.replyTo; });

      // SẮP XẾP BÌNH LUẬN CHA (Gốc): Phân rã nhóm Ghim và nhóm Thường
      var pinnedRoots = rootComments.filter(function(c) { return c.isPinned === true; });
      var normalRoots = rootComments.filter(function(c) { return !c.isPinned; });

      // Thực hiện sắp xếp theo thời gian cho các bình luận gốc không được ghim
      normalRoots.sort(function(a, b) {
        if (currentSortOrder === 'newest') {
          return (b.timestamp || 0) - (a.timestamp || 0); // Mới lên trước
        } else {
          return (a.timestamp || 0) - (b.timestamp || 0); // Cũ lên trước
        }
      });

      // Đối với bình luận đã ghim: Luôn xếp theo thời gian tăng dần để phân cấp thứ tự ghim trước sau
      pinnedRoots.sort(function(a, b) {
        return (a.timestamp || 0) - (b.timestamp || 0);
      });

      // Gộp mảng: Các bài ghim luôn đứng đầu danh sách gốc, không bị ảnh hưởng bởi bộ lọc sắp xếp
      var finalOrderedRoots = pinnedRoots.concat(normalRoots);

      // SẮP XẾP BÌNH LUẬN CON (Trả lời): Sắp xếp trực tiếp theo dòng thời gian đồng bộ
      replyComments.sort(function(a, b) {
        if (currentSortOrder === 'newest') {
          return (b.timestamp || 0) - (a.timestamp || 0);
        } else {
          return (a.timestamp || 0) - (b.timestamp || 0);
        }
      });

	// Hàm sinh cấu trúc HTML cho từng thẻ bình luận
	function generateCommentHTML(cmt, isChild) {
			  var date = new Date(cmt.timestamp);
			  var timeStr = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
			  
			  var displayName = cmt.name && cmt.name.trim() !== "" ? cmt.name.trim() : "Nặc danh";
			  var adminBadge = cmt.isAdmin ? `<span class="px-1.5 py-0.5 bg-emerald-100 text-emerald-700 font-bold rounded text-[9px] uppercase tracking-wider">Admin</span>` : '';
			  var pinBadge = cmt.isPinned ? `<span class="px-1.5 py-0.5 bg-amber-100 text-amber-700 font-bold rounded text-[9px] uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-thumbtack text-[8px]"></i> Đã ghim</span>` : '';
			  
			  var layoutClass = isChild ? 'ml-8 border-l-2 border-slate-200 pl-4 bg-slate-50/70 p-2.5 rounded-r-xl' : 'border border-slate-100 bg-slate-50/40 p-3 rounded-xl';
			  var borderClass = cmt.isPinned ? 'border-amber-200 bg-amber-50/10' : (cmt.isAdmin ? 'border-emerald-200 bg-emerald-50/20' : '');
			  var nameColor = cmt.isAdmin ? 'text-emerald-700 font-bold' : 'text-slate-800 font-semibold';
			  var adminBtnClass = isAdminActive ? '' : 'hidden';

			  var pinActionText = cmt.isPinned ? 'Bỏ ghim' : 'Ghim bài';
			  var pinIconClass = cmt.isPinned ? 'fa-solid fa-unlink' : 'fa-solid fa-thumbtack';

			  // --- XỬ LÝ LOGIC CẢM XÚC PHONG CÁCH FACEBOOK ---
			  var rx = cmt.reactions || {};
			  var favCount = rx.favorite || 0;
			  var hahaCount = rx.haha || 0;
			  var wowCount = rx.wow || 0;
			  var sadCount = rx.sad || 0;
			  var angryCount = rx.angry || 0;
			  
			  // 1. Tính tổng số lượng tất cả cảm xúc
			  var totalReactions = favCount + hahaCount + wowCount + sadCount + angryCount;

			  // 2. Chỉ hiển thị các biểu tượng có lượt tương tác > 0
			  var reactionIconsHTML = '';
			  if (favCount > 0) reactionIconsHTML += '<span class="text-[15px] transition-transform">❤️</span>';
			  if (hahaCount > 0) reactionIconsHTML += '<span class="text-[15px] transition-transform">😆</span>';
			  if (wowCount > 0) reactionIconsHTML += '<span class="text-[15px] transition-transform">😮</span>';
			  if (sadCount > 0) reactionIconsHTML += '<span class="text-[15px] transition-transform">😢</span>';
			  if (angryCount > 0) reactionIconsHTML += '<span class="text-[15px] transition-transform">😡</span>';

			  // 3. Tạo nội dung văn bản chi tiết xuất hiện khi rê chuột (Tooltip)
			  var tooltipText = `❤️ ${favCount}     😆 ${hahaCount}     😮 ${wowCount}     😢 ${sadCount}     😡 ${angryCount}`;

			  // Khối hiển thị tổng hợp (Chỉ xuất hiện khi tổng số tương tác lớn hơn 0)
			  var reactionResultBox = '';
			  if (totalReactions > 0) {
				reactionResultBox = `
				  <div class="relative group/tooltip flex items-center gap-1 bg-white border border-slate-100 shadow-sm px-2 py-0.5 rounded-full cursor-default select-none ml-1">
					<div class="flex items-center -space-x-1 text-xs">
					  ${reactionIconsHTML}
					</div>
					<span class="text-[10px] font-bold text-slate-500">${totalReactions}</span>
					
					<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 hidden group-hover/tooltip:block bg-slate-800 text-white text-[12px] rounded px-2 py-1 whitespace-nowrap z-30 shadow-md">
					  ${tooltipText}
					  <div class="w-1.5 h-1.5 bg-slate-800 rotate-45 absolute top-full left-1/2 -translate-x-1/2 -mt-0.5"></div>
					</div>
				  </div>
				`;
			  }
			  // ------------------------------------------------

			  var processedContent = (cmt.content || "").replace(/(@[^\s:]+)/g, '<span class="text-indigo-600 font-semibold">$1</span>');
			  var replyTargetId = isChild ? cmt.replyTo : cmt._fbKey;
			  var safeName = displayName.replace(/'/g, "\\'");

			  return `
				<div class="flex gap-3 transition-all relative group/item ${layoutClass} ${borderClass}">
				  <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs flex-shrink-0">
					${cmt.name ? cmt.name.charAt(0).toUpperCase() : '?'}
				  </div>
				  <div class="min-w-0 flex-grow">
					<div class="flex items-center gap-1.5 flex-wrap">
					  <span class="text-[14px] ${nameColor}">${displayName}</span>
					  ${adminBadge}
					  ${pinBadge}
					  <span class="text-[12px] text-slate-400 ml-auto">${timeStr}</span>
					</div>
					<p class="text-[14px] text-slate-600 mt-1 leading-relaxed whitespace-pre-line">${processedContent}</p>
					
					<div class="flex flex-wrap items-center gap-y-2 gap-x-3 mt-2 pt-1.5 border-t border-slate-100/60">
					  
					  <button onclick="window._replyToComment('${replyTargetId}', '${safeName}')" class="text-[12px] text-slate-500 hover:text-indigo-600 font-bold flex items-center gap-1 cursor-pointer transition-colors">
						<i class="fa-solid fa-reply text-[10px]"></i> Trả lời
					  </button>

						<div class="relative group/reaction py-1">
						<button class="text-[12px] text-slate-500 group-hover/reaction:text-amber-500 font-bold flex items-center gap-1 cursor-pointer transition-colors py-0.5">
						  <i class="fa-regular fa-face-smile text-[10px]"></i> Cảm xúc
						</button>
						
						<div class="absolute bottom-full left-0 w-full h-3 hidden group-hover/reaction:block bg-transparent z-10"></div>
						
						<div class="absolute bottom-[calc(100%+6px)] left-0 mb-0 hidden group-hover/reaction:flex items-center gap-2 bg-white shadow-xl border border-slate-100 px-3 py-2 rounded-full animate-bounce-short z-20 whitespace-nowrap">
						  <button onclick="window._reactComment('${cmt._fbKey}', 'favorite')" class="text-2xl hover:scale-130 transition-transform duration-150 active:scale-95 cursor-pointer flex items-center justify-center" title="Yêu thích">❤️</button>
						  <button onclick="window._reactComment('${cmt._fbKey}', 'haha')" class="text-2xl hover:scale-130 transition-transform duration-150 active:scale-95 cursor-pointer flex items-center justify-center" title="Haha">😆</button>
						  <button onclick="window._reactComment('${cmt._fbKey}', 'wow')" class="text-2xl hover:scale-130 transition-transform duration-150 active:scale-95 cursor-pointer flex items-center justify-center" title="Wow">😮</button>
						  <button onclick="window._reactComment('${cmt._fbKey}', 'sad')" class="text-2xl hover:scale-130 transition-transform duration-150 active:scale-95 cursor-pointer flex items-center justify-center" title="Buồn">😢</button>
						  <button onclick="window._reactComment('${cmt._fbKey}', 'angry')" class="text-2xl hover:scale-130 transition-transform duration-150 active:scale-95 cursor-pointer flex items-center justify-center" title="Phẫn nộ">😡</button>
						</div>
					  </div>

					  ${reactionResultBox}

					  <div class="ml-auto flex items-center gap-3">
						<button onclick="window._togglePinComment('${cmt._fbKey}', ${cmt.isPinned || false})" class="admin-action-btn ${adminBtnClass} ${isChild ? 'hidden' : ''} text-[12px] text-amber-600 hover:text-amber-800 font-bold flex items-center gap-1 cursor-pointer transition-colors">
						  <i class="${pinIconClass}"></i> ${pinActionText}
						</button>
						<button onclick="window._deleteComment('${cmt._fbKey}')" class="admin-action-btn ${adminBtnClass} text-[12px] text-rose-500 hover:text-rose-700 font-bold flex items-center gap-1 cursor-pointer transition-colors">
						  <i class="fa-regular fa-trash-can"></i> Xóa
						</button>
					  </div>
					</div>

				  </div>
				</div>
			  `;
			}

		  // Liên kết phân cấp cha - con và chèn vào DOM
		  finalOrderedRoots.forEach(function(root) {
			var clusterWrapper = document.createElement('div');
			clusterWrapper.className = 'space-y-2 border-b border-slate-100/60 pb-3 last:border-0';
			
			var clusterHTML = generateCommentHTML(root, false);

			// Lọc toàn bộ bình luận con phản hồi trực tiếp cho khối cha này
			var subReplies = replyComments.filter(function(r) { return r.replyTo === root._fbKey; });
			subReplies.forEach(function(reply) {
			  clusterHTML += generateCommentHTML(reply, true);
			});

			clusterWrapper.innerHTML = clusterHTML;
			commentsWrapper.appendChild(clusterWrapper);
		  });
		}

		// Tải danh sách đồng bộ thời gian thực từ Cloud Firebase
		if (commentRef) {
		  commentRef.on('value', function(snapshot) {
			cachedSnapshotData = snapshot.val() || {};
			renderComments(cachedSnapshotData);
		  });
		}

		// 5. Định nghĩa các hàm tương tác toàn cục liên thông Firebase
		window._replyToComment = function(commentId, targetName) {
		  if (!commentContentInput) return;
		  currentReplyToId = commentId;
		  commentContentInput.value = "@" + targetName.replace(/ /g, "") + " "; 
		  commentContentInput.focus();
		  commentContentInput.scrollIntoView({ behavior: "smooth", block: "center" });
		};

		// Hàm đếm tăng tương tác cảm xúc (Transaction an toàn)
		window._reactComment = function(fbKey, type) {
		  if (!commentRef) return;
		  var reactionPath = commentRef.child(fbKey + '/reactions/' + type);
		  reactionPath.transaction(function(currentCount) {
			return (currentCount || 0) + 1;
		  });
		};

		// Hàm đảo trạng thái ghim bình luận (Chỉ khả dụng cho Admin)
		window._togglePinComment = function(fbKey, currentPinnedStatus) {
		  if (!commentRef) return;
		  commentRef.child(fbKey).update({
			isPinned: !currentPinnedStatus
		  }).catch(function(err) {
			alert("Lỗi thực thi ghim: " + err.message);
		  });
		};

		window._deleteComment = function(fbKey) {
		  if (!commentRef) return;
		  if (confirm("Bạn có chắc chắn muốn xóa vĩnh viễn bình luận này khỏi hệ thống không?")) {
			commentRef.child(fbKey).remove().then(function() {
			  // Xóa đồng loạt bình luận con gắn liền với id cha vừa xóa
			  commentRef.once('value', function(snap) {
				var data = snap.val() || {};
				Object.keys(data).forEach(function(key) {
				  if (data[key].replyTo === fbKey) {
					commentRef.child(key).remove();
				  }
				});
			  });
			}).catch(function(err) {
			  alert("Lỗi không thể xóa: " + err.message);
			});
		  }
		};

		// 6. Sự kiện click nút gửi bình luận
		if (submitCommentBtn) {
		  submitCommentBtn.addEventListener('click', function() {
			var name = commentNameInput ? commentNameInput.value.trim() : '';
			var content = commentContentInput ? commentContentInput.value.trim() : '';

			if (!name) { alert("Vui lòng nhập tên của bạn!"); return; }
			if (!content) { alert("Vui lòng nhập nội dung bình luận!"); return; }

			var newComment = {
			  name: isAdminActive ? "Hiệu Béo 👑" : name,
			  content: content,
			  isAdmin: isAdminActive,
			  timestamp: firebase.database.ServerValue.TIMESTAMP,
			  isPinned: false, // Mặc định tạo mới không ghim
			  reactions: { favorite: 0, haha: 0, wow: 0, sad: 0, angry: 0 } // Khởi tạo bộ đếm
			};

			if (currentReplyToId) {
			  newComment.replyTo = currentReplyToId;
			}

			submitCommentBtn.disabled = true;
			submitCommentBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Đang gửi...';

			if (commentRef) {
			  commentRef.push(newComment).then(function() {
				if (commentContentInput) commentContentInput.value = "";
				currentReplyToId = null; // Trả trạng thái reply về ban đầu
				submitCommentBtn.disabled = false;
				submitCommentBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>Gửi bình luận';
			  }).catch(function(err) {
				console.error("Lỗi gửi bình luận:", err);
				alert("Có lỗi xảy ra khi gửi bình luận!");
				submitCommentBtn.disabled = false;
				submitCommentBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>Gửi bình luận';
			  });
			}
		  });
		}

		// 7. Cấu hình hành động chia sẻ bài viết nhanh
		var shareFbBtn = document.getElementById('share-fb-btn');
		if (shareFbBtn) {
		  shareFbBtn.addEventListener('click', function() {
			var targetUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(currentUrl);
			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
			  window.open(targetUrl, '_blank');
			} else {
			  window.open(targetUrl, '_blank', 'width=600,height=400,resizable=yes,scrollbars=yes');
			}
		  });
		}

		var copyBtn = document.getElementById('copy-link-btn');
		var copyText = document.getElementById('copy-text');
		if (copyBtn && copyText) {
		  copyBtn.addEventListener('click', function() {
			navigator.clipboard.writeText(currentUrl).then(function() {
			  var currentWidth = copyBtn.offsetWidth;
			  copyBtn.style.width = currentWidth + 'px';
			  copyText.textContent = 'Đã sao chép!';
			  copyBtn.classList.remove('bg-slate-100', 'text-slate-700', 'hover:bg-slate-200');
			  copyBtn.classList.add('bg-emerald-50', 'text-emerald-600', 'border-emerald-200');
			  setTimeout(function() {
				copyText.textContent = 'Sao chép liên kết';
				copyBtn.classList.remove('bg-emerald-50', 'text-emerald-600', 'border-emerald-200');
				copyBtn.classList.add('bg-slate-100', 'text-slate-700', 'hover:bg-slate-200');
				copyBtn.style.width = '';
			  }, 2000);
			});
		  });
		}
	  });
  
	// Next page
	document.addEventListener("DOMContentLoaded", function () {
		const commentContainer = document.getElementById('comments-wrapper');
		const paginationContainer = document.getElementById('comment-pagination-container');
		
		if (!commentContainer || !paginationContainer) return;

		const commentsPerPage = 20; // Hiển thị tối đa 20 bình luận
		let currentPage = 1;

		// Hàm xử lý phân trang chính
		function initCommentPagination() {
			// Lấy toàn bộ bình luận hiện có tại thời điểm được gọi
			const allComments = Array.from(commentContainer.children);
			const totalPages = Math.ceil(allComments.length / commentsPerPage);

			// Nếu có ít hơn hoặc bằng 20 bình luận, hiện hết và ẩn thanh phân trang đi
			if (totalPages <= 1) {
				allComments.forEach(comment => comment.style.display = "block");
				paginationContainer.innerHTML = "";
				return;
			}

			// Hàm ẩn/hiện bình luận theo trang
			function showCommentPage(page) {
				currentPage = page;
				const startIndex = (page - 1) * commentsPerPage;
				const endIndex = startIndex + commentsPerPage;

				allComments.forEach((comment, index) => {
					if (index >= startIndex && index < endIndex) {
						comment.style.display = "block"; // Hoặc flex tùy CSS của bạn
					} else {
						comment.style.display = "none";
					}
				});

				renderCommentControls(totalPages);
			}

			// Chạy hiển thị trang hiện tại
			showCommentPage(currentPage);
		}

		// Hàm vẽ nút bấm chuyển trang
		function renderCommentControls(totalPages) {
		    paginationContainer.innerHTML = "";
		    
		    // Cấu trúc khung flex justify-between căng ngang
		    let html = `<div class="flex items-center justify-between w-full max-w-md mx-auto pt-4 border-t border-slate-100 select-none">`;
		
		    // Nút Trước
		    html += `
		        <button id="prev-comment-btn" 
		                class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer flex-shrink-0 ${currentPage === 1 ? 'opacity-40 pointer-events-none' : ''}">
		            <i class="fa-solid fa-angle-left"></i> Trước
		        </button>
		    `;
		
		    // Khung số ở giữa
		    html += `<div class="flex items-center justify-center gap-1 flex-grow min-w-[180px] mx-2">`;
		
		    const range = 2; 
		    let hasLeftDot = false;
		    let hasRightDot = false;
		
		    for (let i = 1; i <= totalPages; i++) {
		        if (i === 1 || i === totalPages || (i >= currentPage - range && i <= currentPage + range)) {
		            const isCurrent = i === currentPage;
		            html += `
		                <button data-cpage="${i}" 
		                        class="comment-page-btn w-7 h-7 text-xs font-bold rounded-lg transition-all cursor-pointer ${isCurrent ? 'bg-indigo-600 text-white' : 'border border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
		                    ${i}
		                </button>
		            `;
		        } else if (i < currentPage - range && !hasLeftDot) {
		            html += `<span class="w-7 text-center text-slate-400 text-xs font-bold">...</span>`;
		            hasLeftDot = true;
		        } else if (i > currentPage + range && !hasRightDot) {
		            html += `<span class="w-7 text-center text-slate-400 text-xs font-bold">...</span>`;
		            hasRightDot = true;
		        }
		    }
		
		    html += `</div>`; // Đóng khung giữa
		
		    // Nút Sau
		    html += `
		        <button id="next-comment-btn" 
		                class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer flex-shrink-0 ${currentPage === totalPages ? 'opacity-40 pointer-events-none' : ''}">
		            Sau <i class="fa-solid fa-angle-right"></i>
		        </button>
		    `;
		
		    html += `</div>`;
		    paginationContainer.innerHTML = html;
		
		    // --- Phần gán addEventListener click của bình luận bên dưới giữ nguyên ---
		    paginationContainer.querySelectorAll('.comment-page-btn').forEach(btn => {
		        btn.addEventListener('click', function() {
		            currentPage = parseInt(this.getAttribute('data-cpage'));
		            initCommentPagination();
		        });
		    });
		    paginationContainer.querySelector('#prev-comment-btn').addEventListener('click', function() { if (currentPage > 1) { currentPage--; initCommentPagination(); } });
		    paginationContainer.querySelector('#next-comment-btn').addEventListener('click', function() { if (currentPage < totalPages) { currentPage++; initCommentPagination(); } });
		}

		// 🎯 GIẢI PHÁP CỐT LÕI: Theo dõi khi nào bình luận thực sự xuất hiện trong khung chứa
		const observer = new MutationObserver(function (mutations) {
			// Mỗi khi danh sách bình luận thay đổi (thêm mới, tải xong...), chạy lại hàm phân trang
			observer.disconnect(); // Tạm dừng theo dõi để tránh lặp vô hạn khi ẩn/hiện
			initCommentPagination();
			observer.observe(commentContainer, { childList: true }); // Kích hoạt theo dõi lại
		});

		// Bắt đầu theo dõi hộp chứa bình luận
		observer.observe(commentContainer, { childList: true });
		
		// Chạy thử lần đầu phòng trường hợp có sẵn HTML tĩnh
		initCommentPagination();
	});
  
  </script>
