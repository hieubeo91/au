  <script>
    function initAllSwipers() {
      document.querySelectorAll('.mySwiper').forEach((el) => {
        if (el.swiper) { el.swiper.destroy(true, true); }
        new Swiper(el, {
          loop: true,
          spaceBetween: 10,
          observer: true,
          observeParents: true,
          pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
          navigation: { nextEl: el.querySelector('.swiper-button-next'), prevEl: el.querySelector('.swiper-button-prev') },
          autoplay: { delay: 4500, disableOnInteraction: true },
        });
      });
    }
    initAllSwipers();

    Fancybox.bind("[data-fancybox^='gallery-']", { Thumbs: { autoStart: true } });

    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) { backToTopBtn.classList.add('show'); }
      else { backToTopBtn.classList.remove('show'); }
    });
    backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    const newsletterForm = document.getElementById('newsletter-form');
    const newsletterSuccess = document.getElementById('newsletter-success');
    if (newsletterForm) {
      newsletterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        newsletterForm.classList.add('hidden');
        newsletterSuccess.classList.remove('hidden');
      });
    }

    const CURRENT_POST = {
      title: "dfgdfg",
      tags: ["dfgdfg"]
    };

    async function loadPosts() {
      try {
        const response = await fetch("../index.html");
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const cards = doc.querySelectorAll(".post-card");
        const posts = [];
        cards.forEach(card => {
          posts.push({
            title: card.dataset.title,
            url: card.dataset.url,
            image: card.dataset.image,
            tags: (card.dataset.tags || "").split(",").map(tag => tag.trim()).filter(Boolean)
          });
        });
        return posts;
      } catch (e) {
        console.error("Lỗi khi tải danh sách bài viết:", e);
        return [];
      }
    }

	function renderPosts(posts) {
      const container = document.getElementById("suggested-posts");
      if(!container) return;
      
      // 🎯 NÂNG CẤP 1: Giới hạn chỉ lấy tối đa đúng 5 bài viết
      const displayPosts = (posts || []).slice(0, 5);
      
      container.innerHTML = "";
      if(displayPosts.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">Không có bài viết gợi ý phù hợp.</div>';
        return;
      }
      
      // 🎯 NÂNG CẤP 2: Chạy vòng lặp trên displayPosts và dùng chuỗi nối (+) để loại bỏ 100% lỗi đơ nút
      displayPosts.forEach(post => {
        let correctUrl = post.url || '#';
        if (!correctUrl.startsWith('../') && !correctUrl.startsWith('./')) {
          correctUrl = '../' + correctUrl;
        }
        const imgUrl = post.image || 'https://raw.githubusercontent.com/hieubeo91/storage/main/blog/icon.png';

        container.innerHTML += '<a href="' + correctUrl + '" class="flex items-start gap-3 group p-2 rounded-xl hover:bg-slate-50 transition-all duration-200">';
        container.innerHTML += '  <img src="' + imgUrl + '" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 border border-slate-100 shadow-sm group-hover:scale-105 transition-transform">';
        container.innerHTML += '  <div class="space-y-1 flex-grow">';
        container.innerHTML += '    <h4 class="text-xs font-bold text-slate-800 group-hover:text-indigo-600 transition-colors line-clamp-2 leading-snug">' + post.title + '</h4>';
        container.innerHTML += '    <span class="text-[10px] text-slate-400 block mt-1">Xem bài viết →</span>';
        container.innerHTML += '  </div>';
        container.innerHTML += '</a>';
      });
    }

    function getRelatedPosts(posts) {
      if (!posts || !Array.isArray(posts)) return [];
      return [...posts]
        .filter(post => {
          if (!post || !CURRENT_POST) return false;
          // 1. Loại bỏ bài viết hiện tại khỏi danh sách hiển thị
          if (post.title === CURRENT_POST.title) return false;
          if (CURRENT_POST.dataUrl && post.url && post.url.includes(CURRENT_POST.dataUrl)) return false;
          
          // 2. Chuyển đổi dữ liệu Danh mục (categories) thành mảng để so sánh
          const postCats = (post.categories || '').split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
          const currentCats = (CURRENT_POST.categories || '').split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
          const hasCommonCategory = currentCats.some(cat => postCats.includes(cat));
          
          // 3. Chuyển đổi dữ liệu Từ khóa (tags) thành mảng để so sánh
          const postTagsStr = Array.isArray(post.tags) ? post.tags.join(',') : (post.tags || '');
          const postTags = postTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          
          const currentTagsStr = Array.isArray(CURRENT_POST.tags) ? CURRENT_POST.tags.join(',') : (CURRENT_POST.tags || '');
          const currentTags = currentTagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          
          const hasCommonTag = currentTags.some(tag => postTags.includes(tag));
          
          return hasCommonCategory || hasCommonTag;
        })
        .slice(0, 3);
    }

    function getRandomPosts(posts) {
      if (!posts || !Array.isArray(posts)) return [];
      return [...posts]
        .filter(post => {
          if (!post) return false;
          if (post.title === CURRENT_POST.title) return false;
          if (CURRENT_POST.dataUrl && post.url && post.url.includes(CURRENT_POST.dataUrl)) return false;
          return true;
        })
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
    }

// Hàm dựng giao diện với bộ Dò Tìm Vùng Chứa thông minh (Tự động sửa lỗi thiếu excerpt)
// Hàm dựng giao diện chuẩn xác trỏ thẳng vào ID của Sidebar
	function renderPosts(postsList) {
	  // Sửa lại: Ưu tiên tìm đúng ID "detail-sidebar-list" ở cột bên phải trước
	  let container = document.getElementById("detail-sidebar-list") || 
					  document.querySelector('#sidebar-posts') || 
					  document.querySelector('.space-y-4.mt-4');
					  
	  if (!container) {
		const btn = document.getElementById("related-btn");
		if (btn && btn.parentElement && btn.parentElement.nextElementSibling) {
		  container = btn.parentElement.nextElementSibling;
		}
	  }

	  if (!container) {
		console.error("Không tìm thấy phân vùng Sidebar hiển thị bài viết trên trang!");
		return;
	  }

	  if (!postsList || postsList.length === 0) {
		container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">Không có bài viết nào phù hợp.</p>`;
		return;
	  }

	  let listHTML = '';
	  postsList.forEach(post => {
		if (!post) return;
		let correctUrl = post.url || '';
		if (correctUrl && !correctUrl.startsWith('http') && !correctUrl.startsWith('../') && !correctUrl.startsWith('./')) {
		  correctUrl = `../${correctUrl}`;
		}
		
		let excerptText = post.excerpt ? post.excerpt.trim() : '';
		if (!excerptText) {
		  const cleanTags = Array.isArray(post.tags) ? post.tags.join(', ') : (post.tags || '');
		  if (cleanTags) {
			excerptText = `Chủ đề bài viết liên quan: ${cleanTags}`;
		  } else {
			excerptText = `Xem chi tiết nội dung bài viết ${post.title}`;
		  }
		}
		
		listHTML += `
		  <a href="${correctUrl}" class="flex items-start gap-3 group p-2 rounded-xl hover:bg-slate-50 transition-colors">

// Mã hóa giấu từ khóa Admin bảo mật (Gốc: hieubeo91@admin)
const _0x4d91 = [110,105,109,100,97,64,49,57,111,101,98,117,101,105];
function _decodeAdminKey() {
    return _0x4d91.map(x => String.fromCharCode(x)).reverse().join('');
}

const commentNameInput = document.getElementById('comment-name');
const commentContentInput = document.getElementById('comment-content');
const submitCommentBtn = document.getElementById('submit-comment-btn');
const commentsWrapper = document.getElementById('comments-wrapper');
let isAdminActive = false;
let currentReplyToId = null; // Quản lý ID bình luận gốc đang được trả lời

// 1. Nhận diện Admin trực tiếp khi gõ từ khóa ẩn
if (commentNameInput) {
    commentNameInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if (val === _decodeAdminKey() && !isAdminActive) {
            isAdminActive = true;
            e.target.value = "Hieubeo (Admin) 👑";
            e.target.classList.add('border-emerald-500', 'bg-emerald-50/30', 'text-emerald-700', 'font-bold');
            e.target.blur();
        }
    });
}

// 2. Kích hoạt cơ chế phản hồi bình luận
window.setReplyTarget = function(commentId, authorName) {
    currentReplyToId = commentId;
    commentContentInput.value = `@${authorName}: `;
    commentContentInput.focus();
    commentContentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

// 3. Cơ chế xóa bình luận bảo mật nghiêm ngặt
window.deleteComment = function(commentId) {
    const password = prompt("Vui lòng nhập mật khẩu quản trị viên để tiến hành xóa bình luận này:");
    if (password === null) return; // Người dùng click Hủy bỏ

    if (password === _decodeAdminKey()) {
        if (confirm("Xác nhận hành động! Bạn có chắc chắn muốn xóa vĩnh viễn bình luận này?")) {
            // Thực hiện xóa bình luận mục tiêu trên Firebase Database
            commentRef.child(commentId).remove()
                .then(() => alert("Đã gỡ bỏ bình luận thành công khỏi hệ thống."))
                .catch(err => console.error("Lỗi cơ sở dữ liệu khi xóa:", err));
                
            // Tiến hành quét tự động để xóa bỏ luôn các bình luận con đang phản hồi bình luận này
            commentRef.once('value', (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    if (childSnapshot.val().replyTo === commentId) {
                        commentRef.child(childSnapshot.key).remove();
                    }
                });
            });
        }
    } else {
        // Thông báo lỗi chính xác theo yêu cầu khi nhập sai mật khẩu quản trị
        alert("Chức năng này đang tạm khóa. Vui lòng liên hệ Admin.");
    }
};

// 4. Lắng nghe dữ liệu thời gian thực và đồng bộ giao diện
commentRef.on('value', (snapshot) => {
    if (!commentsWrapper) return;
    commentsWrapper.innerHTML = '';
    
    const data = snapshot.val() || {};
    const commentList = [];
    
    for (let key in data) {
        commentList.push({ id: key, ...data[key] });
    }
    
    // Xếp thứ tự bình luận tăng dần dựa trên trục thời gian
    commentList.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
    
    // Phân loại luồng dữ liệu: Bình luận Gốc và Bình luận Con (Trả lời)
    const rootComments = commentList.filter(c => !c.replyTo);
    const replyComments = commentList.filter(c => c.replyTo);
    
    if (rootComments.length === 0) {
        commentsWrapper.innerHTML = `<p class="text-slate-400 italic text-center py-6 text-sm">Chưa có bình luận nào. Hãy là người đầu tiên chia sẻ cảm nghĩ!</p>`;
        return;
    }
    
    // Hàm sinh cấu trúc mã HTML tối ưu hóa giao diện đa cấp
    function generateCommentHTML(cmt, isChild = false) {
        const timeDisplay = cmt.timestamp ? new Date(cmt.timestamp).toLocaleString('vi-VN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'}) : 'Vừa xong';
        
        const adminBadge = cmt.isAdmin 
            ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-[10px] font-bold rounded-md flex items-center gap-0.5"><i class="fa-solid fa-crown text-[9px]"></i>Admin</span>` 
            : '';
            
        // Thiết lập lùi lề phân tầng (ml-8) đối với các bình luận dạng phản hồi
        const layoutClass = isChild 
            ? 'ml-8 border-l-2 border-slate-100 pl-4 mt-3 bg-slate-50/60 p-3 rounded-xl' 
            : 'bg-white p-4 rounded-xl border border-slate-100 shadow-sm';
        
        return `
            <div class="group relative transition-all ${layoutClass}">
                <div class="flex items-start gap-3">
                    <img src="${cmt.isAdmin ? 'https://raw.githubusercontent.com/hieubeo91/storage/main/blog/icon.png' : 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(cmt.name)}" class="w-9 h-9 object-cover rounded-xl border border-slate-100 bg-slate-50 flex-shrink-0">
                    <div class="min-w-0 flex-grow">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="text-sm font-bold text-slate-800 tracking-tight">${cmt.name}</span>
                            ${adminBadge}
                            <span class="text-[11px] text-slate-400 font-medium">${timeDisplay}</span>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed whitespace-pre-line">${cmt.content}</p>
                        
                        <div class="flex items-center gap-4 mt-2 pt-0.5">
                            <button onclick="setReplyTarget('${isChild ? cmt.replyTo : cmt.id}', '${cmt.name}')" class="text-xs font-bold text-indigo-500 hover:text-indigo-700 flex items-center gap-1 transition-colors">
                                <i class="fa-solid fa-reply text-[10px]"></i> Trả lời
                            </button>
                            <button onclick="deleteComment('${cmt.id}')" class="text-xs font-medium text-slate-400 hover:text-rose-600 flex items-center gap-1 transition-colors opacity-0 group-hover:opacity-100">
                                <i class="fa-regular fa-trash-can text-[10px]"></i> Xóa
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    // Thực hiện dựng cây sơ đồ cấu trúc cây thư mục lồng nhau
    rootComments.forEach(root => {
        const cluster = document.createElement('div');
        cluster.className = "space-y-3 border-b border-slate-50 pb-4 last:border-0";
        cluster.innerHTML = generateCommentHTML(root, false);
        
        // Quét tìm và gắn toàn bộ câu trả lời trực thuộc cụm bài viết này
        const replies = replyComments.filter(r => r.replyTo === root.id);
        replies.forEach(reply => {
            cluster.innerHTML += generateCommentHTML(reply, true);
        });
        
        commentsWrapper.appendChild(cluster);
    });
});

// 5. Đồng bộ sự kiện Đẩy dữ liệu bình luận lên đám mây Firebase
if (submitCommentBtn) {
    submitCommentBtn.addEventListener('click', () => {
        let name = commentNameInput.value.trim();
        const content = commentContentInput.value.trim();

        if (!name) { alert("Vui lòng nhập tên của bạn!"); return; }
        if (!content) { alert("Vui lòng nhập nội dung bình luận!"); return; }

        if (isAdminActive) {
            name = "Hieubeo (Admin)";
        }

        const newComment = {
            name: name,
            content: content,
            isAdmin: isAdminActive,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        // Nếu có node id phản hồi, lập tức nhúng vào cấu trúc trường replyTo
        if (currentReplyToId) {
            newComment.replyTo = currentReplyToId;
        }

        submitCommentBtn.disabled = true;
        submitCommentBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Đang gửi...`;

        commentRef.push(newComment).then(() => {
            commentContentInput.value = "";
            currentReplyToId = null; // Làm sạch mục tiêu phản hồi cũ
            submitCommentBtn.disabled = false;
            submitCommentBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Gửi bình luận`;
        }).catch(err => {
            console.error("Lỗi đồng bộ Firebase:", err);
            alert("Đã xảy ra sự cố trong quá trình gửi bình luận. Vui lòng kiểm tra kết nối!");
            submitCommentBtn.disabled = false;
            submitCommentBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Gửi bình luận`;
        });
    });
}
