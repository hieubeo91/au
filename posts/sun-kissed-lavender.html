  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"><\/script>
  <script>
    const CURRENT_POST = { title: "{{TITLE_JS}}", categories: [{{CAT_JS}}] };
    Fancybox.bind("[data-fancybox]", {});
    document.querySelectorAll('.swiper').forEach((el, index) => {
      el.classList.add('swiper-post-' + index);
      new Swiper('.swiper-post-' + index, {
        loop: true,
        pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
        navigation: { nextEl: el.querySelector('.swiper-button-next'), prevEl: el.querySelector('.swiper-button-prev') },
      });
    });
    const btt = document.getElementById("back-to-top");
    window.addEventListener("scroll", () => { if (window.scrollY > 300) btt.classList.add("show"); else btt.classList.remove("show"); });
    btt.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); });
    async function loadPosts() {
      try {
        const response = await fetch('../baigioithieu.html');
        const text = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const articles = doc.querySelectorAll('article.post-card');
        return Array.from(articles).map(art => ({
          id: art.getAttribute('data-id'),
          title: art.getAttribute('data-title'),
          url: '../' + art.getAttribute('data-url'),
          image: art.getAttribute('data-image'),
          categories: art.getAttribute('data-categories').split(',').map(c => c.trim()),
          tags: art.getAttribute('data-tags'),
          date: art.querySelector('.fa-calendar')?.parentElement?.textContent?.trim() || 'Mới'
        }));
      } catch (e) { console.error("Lỗi tải bài viết sidebar:", e); return []; }
    }
    function renderPosts(postsList) {
      const container = document.getElementById("sidebar-posts-container");
      if (postsList.length === 0) { container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Không có bài viết nào khác.</p>'; return; }
      container.innerHTML = postsList.map(post => `
        <div class="flex gap-3 items-center group border-b border-slate-50 pb-3 last:border-0 last:pb-0">
          <img src="${post.image}" class="w-14 h-14 rounded-xl object-cover border border-slate-100 flex-shrink-0">
          <div class="min-w-0 flex-grow">
            <h4 class="text-xs font-bold text-slate-800 line-clamp-2 group-hover:text-indigo-600 transition-colors"><a href="${post.url}">${post.title}</a></h4>
            <p class="text-[10px] text-slate-400 mt-0.5"><i class="fa-regular fa-calendar mr-1"></i>${post.date}</p>
          </div>
        </div>
      `).join('');
    }
    function getRelatedPosts(posts) { return posts.filter(post => post.title !== CURRENT_POST.title && post.categories.some(cat => CURRENT_POST.categories.includes(cat))).slice(0, 5); }
    function getRandomPosts(posts) { return posts.filter(post => post.title !== CURRENT_POST.title).sort(() => Math.random() - 0.5).slice(0, 5); }
    let ALL_POSTS = [];
    loadPosts().then(posts => { ALL_POSTS = posts; renderPosts(getRelatedPosts(posts)); });
    document.getElementById("related-btn").addEventListener("click", () => {
      renderPosts(getRelatedPosts(ALL_POSTS));
      document.getElementById("related-btn").className = "flex-1 py-2 text-center rounded-lg transition-colors bg-indigo-600 text-white shadow-sm";
      document.getElementById("random-btn").className = "flex-1 py-2 text-center rounded-lg transition-colors text-slate-600 hover:text-slate-900";
    });
    document.getElementById("random-btn").addEventListener("click", () => {
      renderPosts(getRandomPosts(ALL_POSTS));
      document.getElementById("random-btn").className = "flex-1 py-2 text-center rounded-lg transition-colors bg-indigo-600 text-white shadow-sm";
      document.getElementById("related-btn").className = "flex-1 py-2 text-center rounded-lg transition-colors text-slate-600 hover:text-slate-900";
    });
  <\/script>
