  <script>
    function initAllSwipers() {
      document.querySelectorAll('.mySwiper').forEach((el) => {
        if (el.swiper) { el.swiper.destroy(true, true); }
        new Swiper(el, {
          loop: true,
          spaceBetween: 10,
          observer: true,
          observeParents: true,
          pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
          navigation: { nextEl: el.querySelector('.swiper-button-next'), prevEl: el.querySelector('.swiper-button-prev') },
          autoplay: { delay: 4500, disableOnInteraction: true },
        });
      });
    }
    initAllSwipers();

    Fancybox.bind("[data-fancybox^='gallery-']", { Thumbs: { autoStart: true } });

    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) { backToTopBtn.classList.add('show'); }
      else { backToTopBtn.classList.remove('show'); }
    });
    backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    const newsletterForm = document.getElementById('newsletter-form');
    const newsletterSuccess = document.getElementById('newsletter-success');
    if (newsletterForm) {
      newsletterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        newsletterForm.classList.add('hidden');
        newsletterSuccess.classList.remove('hidden');
      });
    }

    const CURRENT_POST = {
      title: "sdfdsf",
      tags: ["sdfsdf"]
    };

    async function loadPosts() {
      try {
        const response = await fetch("../index.html");
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const cards = doc.querySelectorAll(".post-card");
        const posts = [];
        cards.forEach(card => {
          posts.push({
            title: card.dataset.title,
            url: card.dataset.url,
            image: card.dataset.image,
            tags: (card.dataset.tags || "").split(",").map(tag => tag.trim()).filter(Boolean)
          });
        });
        return posts;
      } catch (e) {
        console.error("Lỗi khi tải danh sách bài viết:", e);
        return [];
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById("suggested-posts");
      if(!container) return;
      container.innerHTML = "";
      if(posts.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400">Không có bài viết gợi ý phù hợp.</div>';
        return;
      }
      posts.forEach(post => {
        container.innerHTML += `
          <a href="../\${post.url}" class="flex gap-3 p-3 rounded-xl bg-slate-50 hover:bg-indigo-50 transition">
            <img src="\${post.image}" class="w-20 h-20 rounded-lg object-cover">
            <div>
              <div class="font-semibold text-slate-800">\${post.title}</div>
              <div class="text-xs text-slate-500 mt-1">Xem bài viết →</div>
            </div>
          </a>
        `;
      });
    }

// =========================================================================
      // 🎯 SỬA LỖI HIỂN THỊ BÀI VIẾT LIÊN QUAN & BÀI VIẾT NGẪU NHIÊN CHUẨN HTML
      // =========================================================================
      
      var sidebarAllPosts = [];
      var currentActiveTab = 'related';

      // Hàm chuyển đổi trạng thái giao diện Tab và kích hoạt re-render làm mới danh sách
      window.switchSidebarTab = function(type) {
        currentActiveTab = type;
        const btnTabRelated = document.getElementById('btn-tab-related');
        const btnTabRandom = document.getElementById('btn-tab-random');
        
        if (type === 'related') {
          if(btnTabRelated) btnTabRelated.className = "flex-1 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors cursor-pointer";
          if(btnTabRandom) btnTabRandom.className = "flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors cursor-pointer";
        } else {
          if(btnTabRandom) btnTabRandom.className = "flex-1 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 transition-colors cursor-pointer";
          if(btnTabRelated) btnTabRelated.className = "flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors cursor-pointer";
        }
        
        // Gọi hàm render để luôn tính toán làm mới hoặc xáo trộn lại ngẫu nhiên danh sách dữ liệu bài viết
        renderSidebarContent(type);
      };

      function renderSidebarContent(type) {
        const sidebarList = document.getElementById('detail-sidebar-list');
        if (!sidebarList) return;

        if (!sidebarAllPosts || sidebarAllPosts.length === 0) {
          sidebarList.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Đang dữ liệu bài viết...</p>';
          return;
        }

        // Loại bỏ chính bài viết hiện tại ra khỏi danh sách đề xuất ở cột phải
        const currentTitleEl = document.querySelector('h1');
        const currentTitle = currentTitleEl ? currentTitleEl.textContent.trim() : '';
        let filtered = sidebarAllPosts.filter(function(p) { return p.title !== currentTitle; });

        if (type === 'related') {
          const currentTags = Array.from(document.querySelectorAll('.tag-badge')).map(function(t) { 
            return t.textContent.trim().toLowerCase(); 
          });
          
          let related = filtered.filter(function(p) {
            const pTags = (p.tags || '').split(',').map(function(t) { return t.trim().toLowerCase(); }).filter(Boolean);
            return pTags.some(function(tag) { return currentTags.includes(tag); });
          });

          // Nếu không có bài nào trùng tag, mượn tạm danh sách bài viết khác để tránh sidebar trống
          filtered = related.length > 0 ? related : filtered;
        } else if (type === 'random') {
          // Thực hiện xáo trộn ngẫu nhiên toàn bộ danh sách bài viết nền mỗi khi click vào tiêu đề tab
          filtered.sort(function() { return 0.5 - Math.random(); });
        }

        // 🎯 THAY ĐỔI CỐT LÕI: Điều chỉnh cắt mảng lấy tối đa 5 bài viết xuất sắc nhất
        const displayPosts = filtered.slice(0, 5);

        if (displayPosts.length === 0) {
          sidebarList.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Không có bài viết nào khác.</p>';
          return;
        }

        let listHTML = '';
        displayPosts.forEach(function(post) {
          let correctUrl = post.url || '#';
          if (!correctUrl.startsWith('../') && !correctUrl.startsWith('./')) {
            correctUrl = '../' + correctUrl;
          }
          const imgUrl = post.image || 'https://raw.githubusercontent.com/hieubeo91/storage/main/blog/icon.png';
          const postDate = post.date || '';

          listHTML += '<a href="' + correctUrl + '" class="flex items-start gap-3 group p-2 rounded-xl hover:bg-slate-50 transition-all duration-200">';
          listHTML += '  <img src="' + imgUrl + '" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 border border-slate-100 shadow-sm group-hover:scale-105 transition-transform">';
          listHTML += '  <div class="space-y-1 flex-grow">';
          listHTML += '    <h4 class="text-xs font-bold text-slate-800 group-hover:text-indigo-600 transition-colors line-clamp-2 leading-snug">' + post.title + '</h4>';
          listHTML += '    <span class="text-[10px] text-slate-400 block"><i class="fa-regular fa-calendar mr-1"></i>' + postDate + '</span>';
          listHTML += '  </div>';
          listHTML += '</a>';
        });

        sidebarList.innerHTML = listHTML;
      }

      // Khi trang tải xong, tự động thu thập thông tin bài viết từ các thẻ card ngoài trang chủ
      document.addEventListener('DOMContentLoaded', function() {
        const postsContainer = document.getElementById('posts-container');
        if (postsContainer) {
          const cards = postsContainer.querySelectorAll('.post-card');
          cards.forEach(function(card) {
            const titleEl = card.querySelector('h2');
            if (titleEl) {
              const pTitle = titleEl.textContent.trim();
              const pImg = card.getAttribute('data-image') || '';
              const pUrl = card.getAttribute('data-url') || '';
              const dateEl = card.querySelector('.post-date');
              const pDate = dateEl ? dateEl.textContent.trim() : '';
              
              const tagEls = card.querySelectorAll('.tag-badge');
              const pTags = Array.from(tagEls).map(function(t) { return t.textContent.trim(); }).join(',');

              sidebarAllPosts.push({
                title: pTitle,
                image: pImg,
                url: pUrl,
                date: pDate,
                tags: pTags
              });
            }
          });
        }

        // Thực hiện render mặc định Tab "Liên quan" khi mở trang con lên
        renderSidebarContent('related');
      });
  </script>
